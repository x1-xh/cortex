[workspace]
resolver = "2"
members = [
    "crates/cortex-core",
    "crates/cortex-runtime",
    "crates/cortex-harness",
    "crates/cortex-tui",
    "crates/cortex-cli",
]
default-members = ["crates/cortex-cli"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Cortex Contributors"]
repository = "https://github.com/cortex-ai/cortex"
publish = false

[workspace.dependencies]
cortex-core = { path = "crates/cortex-core", version = "0.1.0-alpha.1" }
cortex-runtime = { path = "crates/cortex-runtime", version = "0.1.0-alpha.1" }
cortex-harness = { path = "crates/cortex-harness", version = "0.1.0-alpha.1" }
cortex-tui = { path = "crates/cortex-tui", version = "0.1.0-alpha.1" }
thiserror = "2.0"
tracing = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
toml = "0.8"

