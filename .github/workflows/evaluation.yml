name: Evaluation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "benchmarks/**"

jobs:
  deterministic-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run coding benchmark suite
        run: cargo run -p cortex-cli --bin cortex -- bench run --suite coding --report eval-coding.md
      - name: Run refactor benchmark suite
        run: cargo run -p cortex-cli --bin cortex -- bench run --suite refactor --report eval-refactor.md
      - name: Run CLI benchmark suite
        run: cargo run -p cortex-cli --bin cortex -- bench run --suite cli --report eval-cli.md
      - name: Run multi-agent benchmark suite
        run: cargo run -p cortex-cli --bin cortex -- bench run --suite multi-agent --report eval-multi-agent.md
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-evaluation-reports
          path: eval-*.md
